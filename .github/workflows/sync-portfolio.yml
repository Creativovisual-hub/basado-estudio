name: Sincronizar portfolio

# Vuelve a leer creativovisualchile.myportfolio.com y, si hay cambios,
# los sube. Vercel detecta el commit y republica la web sola.
#
#   · Cada lunes a las 09:00 (hora de Santiago, UTC-3 → 12:00 UTC)
#   · O a mano desde la pestaña Actions de GitHub ("Run workflow")

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Leer el portfolio
        run: node scripts/scrape-portfolio.mjs

      - name: Publicar si hay cambios
        run: |
          if git diff --quiet -- lib/portfolio-data.json; then
            echo "Sin cambios en el portfolio."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/portfolio-data.json
          git commit -m "Sincronizar proyectos desde Adobe Portfolio"
          git push
